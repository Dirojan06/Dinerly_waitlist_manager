<section class="food-page">

  <div class="page-heading">
    <div>
      <p>DISCOVER FOOD</p>
      <h1>Find something delicious</h1>
    </div>
  </div>

  <div class="food-search">
    <i class="fa-solid fa-magnifying-glass"></i>

    <input
      type="text"
      [(ngModel)]="searchText"
      placeholder="Search restaurants or cuisines"
    />
  </div>

  <div class="food-categories">
    <button
      type="button"
      *ngFor="let 
        category of categories"
      [class.active]="
        category.id === selectedCategoryId
      "
      (click)="onCategorySelect(category.id, category.name)"
    >
      {{ category.name }}
    </button>
  </div>

  <div class="food-grid">

    <article
      class="food-card"
      *ngFor="let item of dishes; let i = index"
    >

      <div
        class="food-image">
        <div class="food-plate">
          <img [src]="item.imageUrl " [alt]="item.name" class="food-img loading" loading="lazy"
                    decoding="async" (load)="onImageLoad($event)">
        </div>
      </div>

      <div class="food-body">

        <h3>
          {{ item.name }}
        </h3>

        <p>
          CAD{{ item.price }}$
          ·
          {{ item.calories }} Calories
        </p>

        <div class="food-meta">
          <span>
            ★ {{ item.category }}
          </span>


        </div>

       

      </div>

    </article>

  </div>

</section>
