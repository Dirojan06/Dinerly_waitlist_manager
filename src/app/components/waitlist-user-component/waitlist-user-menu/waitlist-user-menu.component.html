<section class="food-page">

  <div class="page-heading">
    <div>
      <p>DISCOVER FOOD</p>
      <h1>Find something delicious</h1>
    </div>
  </div>

  <div class="food-search">
    <i class="fa-solid fa-magnifying-glass"></i>

    <input
      type="text"
      [(ngModel)]="searchText"
      placeholder="Search restaurants or cuisines"
    />
  </div>

  <div class="food-categories">
    <button
      type="button"
      *ngFor="let cuisine of cuisines"
      [class.active]="
        selectedCuisine === cuisine
      "
      (click)="selectedCuisine = cuisine"
    >
      {{ cuisine }}
    </button>
  </div>

  <div class="food-grid">

    <article
      class="food-card"
      *ngFor="
        let restaurant of
        filteredRestaurants
      "
    >

      <div
        class="food-image"
        [ngClass]="restaurant.imageClass"
      >
        <div class="food-plate"></div>
      </div>

      <div class="food-body">

        <h3>
          {{ restaurant.name }}
        </h3>

        <p>
          {{ restaurant.cuisine }}
          ·
          {{ restaurant.distance }}
        </p>

        <div class="food-meta">
          <span>
            ★ {{ restaurant.rating }}
          </span>

          <span>
            {{ restaurant.deliveryTime }}
          </span>

          <span>
            {{ restaurant.priceLevel }}
          </span>
        </div>

        <button type="button">
          View menu
        </button>

      </div>

    </article>

  </div>

</section>
